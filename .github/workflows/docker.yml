name: Docker image

# Builds docker/Dockerfile and publishes it as ghcr.io/iamskeole/kokon-ee: on every push to
# main (tag <short sha>), plus latest; or on demand with a commit. The image holds no image
# models — those live on the box's engines; the lab models download into the data volume on
# first use. Guide: docs/fresh-box.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/iamskeole/kokon-ee
          tags: |
            type=sha,prefix=multiuser-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kokon EE
            org.opencontainers.image.description=The Kokon service box: browser UI + MCP, engines on the box's gateway
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
