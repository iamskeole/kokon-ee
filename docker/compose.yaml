# Kokon service box, used from a browser: http://<this box's address>:39152
#
# The container is the service + the browser UI. Inference does not run
# inside it: the engines (stable-diffusion.cpp, the vision door, the
# assistant) live on the engine box behind its one-door gateway
# (llama-swap), and this box's config (config/config.json, beside this
# file) points at that gateway. In single-box mode the lab's in-process
# models run on CPU, so no GPU is needed on this box at all.
#
# In the folder with this file (data/, config/ and gallery/ beside it —
# the service runs as uid 1000 and must be able to write all three):
#
#   docker compose pull && docker compose up -d     # update + (re)start
#   docker exec -it kokon-ee kokon-service --set-password   # once
#
# The image is published by the repo's CI on every push to main (tags
# multiuser-<sha> and latest); a local build of the same docker/Dockerfile
# is the verifiable route. Whole stack: docs/fresh-box.md. Split layout
# (this box family-sized, the engine box elsewhere): docs/service-on-prod-box.md.

services:
  kokon-ee:
    image: ghcr.io/iamskeole/kokon-ee:latest
    container_name: kokon-ee
    restart: unless-stopped
    network_mode: host          # the service binds 127.0.0.1 (token API) and
                                # drops foreign source addresses on its LAN
                                # listener: host mode is deliberate
    volumes:
      - ./data:/data            # gallery + projects DB, service token, lab models, logs
      - ./config:/config        # settings (config.json: the gateway address + key)
      - ./gallery:/gallery      # the images saved to the gallery
